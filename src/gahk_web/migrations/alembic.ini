# Alembic's settings for gahk_web's migrations. The code builds its Config from this file by its path
# (db.alembic_config), and so does Flask-Migrate (`flask db ...`, task migration): nothing here
# depends on the current directory. env.py sets up the database connection.
[alembic]
# 0002_add_something.py: env.py numbers each new revision after the newest one.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
