name: Feature request
description: Propose a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard today?
      placeholder: Visitors can't see which rooms are free for sublet without writing to us.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Link a spec in spec/features/ if one applies.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "pages / menu / layout"
        - "news and events"
        - "admission forms"
        - "statistics"
        - "sync with intern.gahk.dk"
        - "self-update / webhost"
        - "other"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, or how it's handled today.
