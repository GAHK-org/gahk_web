version: 2
# Version updates go to dev and ship with the next release, like any other change. Security updates
# ignore target-branch and always open against main (the default branch); they are hotfixes, and
# sync-main-to-dev.yml carries them back to dev.
updates:
  # Python dependencies (pyproject.toml + uv.lock). The runtime ones reach the webhost as the
  # bundle's hash-pinned requirements.lock, which its updater installs with pip; the bundle job fails
  # on one without a binary wheel for the host's python, or whose compiled parts will not load.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # Batch routine bumps into one PR each to cut review noise; security fixes
    # still come as their own PRs regardless of grouping.
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]

  # Tailwind, which builds the stylesheet (package.json + package-lock.json). The built file is
  # committed, so a bump's PR must carry it rebuilt: CI's css job fails until it does.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      tailwind:
        patterns: ["*"]

  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # The fake webhost of the end-to-end test (scripts/fake_webhost/Dockerfile). It is on Debian's
  # codename tag, trixie-slim, because the real webhost runs trixie: Dependabot does not move a
  # codename tag, so this watches the file without proposing a Debian release the webhost lacks.
  - package-ecosystem: "docker"
    directory: "/scripts/fake_webhost"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]
