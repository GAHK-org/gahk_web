name: CI

on:
  push:
    branches: [main]
  pull_request:

# The webhost runs the system python3 as CGI: 3.11 today, 3.13 after Hetzner's 2026 OS update. The
# lint and type jobs use the oldest; `test` and `bundle` run on both.
env:
  UV_PYTHON: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv run mypy

  # Hetzner's PostgreSQL is 15 today and 17 after the same update; each pairing is tested as it
  # will run (old python with old database, new with new).
  test:
    name: test (Python ${{ matrix.python }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", postgres: "15" }
          - { python: "3.13", postgres: "17" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_DB: gahk_web_test, POSTGRES_USER: gahk, POSTGRES_PASSWORD: gahk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gahk" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      GAHK_WEB_TEST_DATABASE: postgres://gahk:gahk@localhost:5432/gahk_web_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv run pytest -q

  # Builds the release bundle and tries it the way the webhost will: both self-tests with only the
  # bundle on sys.path on 3.11 and 3.13, then a first install through the CGI stub from the three
  # bootstrap files, a publish, and an update that must change nothing (scripts/smoke_bundle.py).
  bundle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_DB: gahk_web_smoke, POSTGRES_USER: gahk, POSTGRES_PASSWORD: gahk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gahk" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.11 3.13
      - run: uv run python scripts/build_bundle.py
      - run: >-
          uv run python scripts/smoke_bundle.py --python 3.11 --python 3.13
          --database postgres://gahk:gahk@localhost:5432/gahk_web_smoke
      - name: Bundle size
        run: |
          ls -l dist
          cat dist/manifest.json >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Audit the locked runtime dependencies (exported from uv.lock, no requirements file committed).
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/req.txt
      - run: uvx pip-audit -r /tmp/req.txt

  # Publishes the bundle to the rolling GitHub release `production`, the webhost's update channel:
  # its updater reads manifest.json there whenever intern nudges it (DEPLOY.md). The bundle is built
  # again from this commit (the build is reproducible) and self-tested before it is uploaded.
  # `security` is left out on purpose, as in gahk_intern: a new advisory against a dependency should
  # not freeze releases, least of all the one that bumps it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: production
    steps:
      # Two merges in quick succession race, and the older run can finish last. Only the current
      # tip of main may become the production manifest, or the webhost would roll back.
      - name: Is this still the tip of main?
        id: tip
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "main has moved on to \`${tip}\` — leaving the release to that run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.tip.outputs.result == 'true'
        uses: actions/checkout@v7
      - if: steps.tip.outputs.result == 'true'
        uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - if: steps.tip.outputs.result == 'true'
        name: Build and self-test the bundle
        run: |
          uv python install 3.11 3.13
          uv run python scripts/build_bundle.py
          uv run python scripts/smoke_bundle.py --python 3.11 --python 3.13

      - if: steps.tip.outputs.result == 'true'
        name: Create the release if it is missing
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Produktion (rullende)" \
              --notes "Webhotellets opdateringskanal. gahk.dk henter manifest.json herfra, når intern.gahk.dk beder den om at opdatere sig (hvert kvarter og med knappen \"Opdatér gahk.dk nu\"), og installerer den bundle, manifestet peger på. CI erstatter filerne ved hvert merge til main; tagget flytter sig ikke og siger intet om versionen – den står i manifest.json. updater.py, gahk.cgi og htaccess er de tre filer til den første installation (se DEPLOY.md). Slet ikke denne release."
          fi

      # The bundle first and the manifest last, so the manifest never names a file not there yet.
      - if: steps.tip.outputs.result == 'true'
        name: Upload the bundle
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/gahk_web-*.tar.gz dist/manifest-*.json dist/updater.py dist/gahk.cgi dist/htaccess
      - if: steps.tip.outputs.result == 'true'
        name: Upload the manifest (main must still be here)
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main moved on to \`${tip}\` during the build — leaving manifest.json to that run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/manifest.json
          {
            echo "### Published to the \`${TAG}\` release"
            echo
            echo '```json'
            cat dist/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the newest 5 bundles (and their manifest-<sha>.json), so [update] pin can roll back.
      - if: steps.tip.outputs.result == 'true'
        name: Delete old bundles
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | test("^gahk_web-[0-9a-f]{40}\\.tar\\.gz$")) | [.createdAt, .name] | @tsv' \
            | sort -r | tail -n +6 | while IFS=$'\t' read -r _ name; do
              sha=${name#gahk_web-}
              sha=${sha%.tar.gz}
              echo "deleting ${name}"
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
              gh release delete-asset "$TAG" "manifest-${sha}.json" --repo "$GITHUB_REPOSITORY" --yes || true
            done
