# gahk.dk on the fake webhost: the account's ~/public_html is the document root, as on Hetzner.
# The handler mapping is the SERVER's (verified on the webhost: no .htaccess line is needed for
# *.cgi, *.py or *.fcgi); everything else comes from the release's .htaccess.

ServerName gahk.dk

<Directory /usr/home/${GAHK_LOGIN}/public_html>
    Options +ExecCGI +SymLinksIfOwnerMatch
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
    AddHandler cgi-script .cgi .py
    AddHandler fcgid-script .fcgi
</Directory>

# The handler of each request (%R: fcgid-script, cgi-script or - for a file) and the runner header,
# so the driver can tell which requests started Python and how.
LogFormat "%v %h \"%r\" %>s %>R \"%>{X-Gahk-Runner}o\" %D" fake_hetzner

<VirtualHost *:80>
    ServerName gahk.dk
    ServerAlias www.gahk.dk
    DocumentRoot /usr/home/${GAHK_LOGIN}/public_html
    Include /etc/apache2/fake-hetzner/identity.conf
    CustomLog ${APACHE_LOG_DIR}/access.log fake_hetzner
</VirtualHost>

<VirtualHost *:443>
    ServerName gahk.dk
    ServerAlias www.gahk.dk
    DocumentRoot /usr/home/${GAHK_LOGIN}/public_html
    Include /etc/apache2/fake-hetzner/identity.conf
    SSLEngine on
    SSLCertificateFile /etc/ssl/fake-hetzner/gahk.dk.crt
    SSLCertificateKeyFile /etc/ssl/fake-hetzner/gahk.dk.key
    CustomLog ${APACHE_LOG_DIR}/access.log fake_hetzner
</VirtualHost>
