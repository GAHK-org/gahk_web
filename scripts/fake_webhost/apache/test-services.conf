# Stand-ins for the two outside services gahk.dk talks to, reachable only inside the container
# (port 8080 on loopback; the driver adds releases.test and intern.test to /etc/hosts). They are
# test plumbing, not part of the fake account.

Listen 127.0.0.1:8080

# GitHub's release `production`: manifest.json and manifest-<sha>.json under /download/. Like GitHub,
# a bundle download answers with a redirect to another host's storage, which the updater follows.
<VirtualHost 127.0.0.1:8080>
    ServerName releases.test
    DocumentRoot /srv/releases
    <Directory /srv/releases>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteRule ^/download/(gahk_web-[0-9a-f]{40}\.tar\.gz)$ http://releases.test:8080/storage/$1 [R=302,L]
    CustomLog ${APACHE_LOG_DIR}/releases.log fake_hetzner
</VirtualHost>

# intern.gahk.dk's calendar feeds, for the /kalender/<token>.ics pass-through.
<VirtualHost 127.0.0.1:8080>
    ServerName intern.test
    DocumentRoot /srv/intern
    <Directory /srv/intern>
        Require all granted
    </Directory>
    AddType "text/calendar; charset=utf-8" .ics
    Header set Cache-Control "private, max-age=0"
    CustomLog ${APACHE_LOG_DIR}/intern.log fake_hetzner
</VirtualHost>
