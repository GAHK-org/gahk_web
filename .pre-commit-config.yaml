# Pre-commit hooks, run via `prek` (a fast, pre-commit-compatible runner).
#   Install the git hook once:   task hooks     (= uv run prek install)
#   Run against everything:      uv run prek run --all-files
#
# Hooks are `local`/`system` and shell out to `uv run …`, so they use the exact tool versions
# pinned in uv.lock (no separate hook environments, no version drift vs CI).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (--fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # mypy checks the files listed in pyproject.toml ([tool.mypy] files), so it ignores the
      # changed-file list and always runs on all of them. Adds a few seconds to each commit;
      # move to `stages: [pre-push]` if that becomes annoying.
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      # The committed stylesheet is built from styles/site.css and the classes in the templates. When
      # either changes, this rebuilds it; a rebuilt file fails the commit, as any hook that writes
      # does: stage src/gahk_web/static/css/site.css and commit again. Needs Node (task css:install).
      - id: tailwind-css
        name: Tailwind stylesheet (src/gahk_web/static/css/site.css)
        entry: npm run --silent build:css
        language: system
        files: ^(styles/|src/gahk_web/templates/.*\.html$|package(-lock)?\.json$)
        pass_filenames: false
        require_serial: true
